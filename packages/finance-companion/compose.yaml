services:
  finance-companion:
    build:
      context: ../..
      dockerfile: packages/finance-companion/Dockerfile
    image: ${FINANCE_COMPANION_IMAGE:-finance-companion:0.0.1}
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,noexec,nosuid,nodev,size=64m
    environment:
      FINANCE_COMPANION_BIND_ADDRESS: "127.0.0.1"
      FINANCE_COMPANION_PORT: "4100"
      FINANCE_COMPANION_ORIGIN: "http://127.0.0.1:4100"
      FINANCE_COMPANION_DATA_DIR: /data
      FINANCE_COMPANION_ACTUAL_API_DIR: /actual-api
      FINANCE_COMPANION_INTEGRITY_ANCHOR_PATH: /integrity-anchor/integrity-anchor.json
      FINANCE_COMPANION_INTEGRITY_MAC_KEY_FILE: /run/secrets/integrity-mac-key
      FINANCE_COMPANION_BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup-encryption-key
      FINANCE_COMPANION_ACTUAL_PASSWORD_FILE: /run/secrets/actual-password
      FINANCE_COMPANION_OWNER_BOOTSTRAP_CREDENTIAL_FILE: /run/secrets/owner-bootstrap-credential
      FINANCE_COMPANION_ACTUAL_SERVER_URL: ${FINANCE_COMPANION_ACTUAL_SERVER_URL:?Set FINANCE_COMPANION_ACTUAL_SERVER_URL}
      FINANCE_COMPANION_ACTUAL_BUDGET_ID: ${FINANCE_COMPANION_ACTUAL_BUDGET_ID:?Set FINANCE_COMPANION_ACTUAL_BUDGET_ID}
      FINANCE_COMPANION_ACTUAL_BUDGET_CURRENCY: ${FINANCE_COMPANION_ACTUAL_BUDGET_CURRENCY:?Set FINANCE_COMPANION_ACTUAL_BUDGET_CURRENCY}
    volumes:
      - finance-companion-actual-api:/actual-api
      - finance-companion-data:/data
      - finance-companion-integrity-anchor:/integrity-anchor
    secrets:
      - source: finance_companion_integrity_mac_key
        target: integrity-mac-key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: finance_companion_backup_encryption_key
        target: backup-encryption-key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: finance_companion_actual_password
        target: actual-password
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: finance_companion_owner_bootstrap_credential
        target: owner-bootstrap-credential
        uid: "10001"
        gid: "10001"
        mode: 0400
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  finance-companion-actual-api:
  finance-companion-data:
  finance-companion-integrity-anchor:

secrets:
  finance_companion_integrity_mac_key:
    environment: FINANCE_COMPANION_INTEGRITY_MAC_KEY_SECRET
  finance_companion_backup_encryption_key:
    environment: FINANCE_COMPANION_BACKUP_ENCRYPTION_KEY_SECRET
  finance_companion_actual_password:
    environment: FINANCE_COMPANION_ACTUAL_PASSWORD_SECRET
  finance_companion_owner_bootstrap_credential:
    environment: FINANCE_COMPANION_OWNER_BOOTSTRAP_CREDENTIAL_SECRET
